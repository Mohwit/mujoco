<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">MuJoCo state stepping pipeline</title><desc id="desc">Current qpos and qvel become acceleration, then a step produces new qpos, qvel, and time.</desc><style>text{font-family:system-ui,sans-serif;fill:#172033}.box{fill:#eef6ff;stroke:#2563eb;stroke-width:3}.green{fill:#ecfdf5;stroke:#087f72;stroke-width:3}.arrow{stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="500" y="35" text-anchor="middle" font-size="24" font-weight="700">One MuJoCo simulation step</text><rect class="box" x="40" y="105" width="210" height="105" rx="14"/><text x="145" y="140" text-anchor="middle" font-weight="700">MjData now</text><text x="145" y="170" text-anchor="middle">qpos, qvel, time</text><line class="arrow" x1="250" y1="158" x2="330" y2="158"/><rect class="green" x="330" y="105" width="220" height="105" rx="14"/><text x="440" y="140" text-anchor="middle" font-weight="700">mj_step()</text><text x="440" y="170" text-anchor="middle">forces and qacc</text><line class="arrow" x1="550" y1="158" x2="630" y2="158"/><rect class="box" x="630" y="105" width="300" height="105" rx="14"/><text x="780" y="140" text-anchor="middle" font-weight="700">MjData next</text><text x="780" y="170" text-anchor="middle">new qpos, qvel, time + dt</text><text x="500" y="275" text-anchor="middle" fill="#475569">mj_forward computes derived values without advancing time</text></svg>
